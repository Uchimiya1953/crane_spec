<section id="app" aria-live="polite"></section>

const state={model:0};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;",'\'':"&#39;"}[m]));
const statusLabel={ok:"記載値",missing:"未記載",unreadable:"読み取り不能",check:"要確認"};
function leaf(n){const st=n.status||"ok";return `<div class="leaf ${st}"><div class="name">${esc(n.name)}<span class="badge">${statusLabel[st]}</span></div><div class="val">${esc(n.value)}</div><div class="unit">${esc(n.unit)}</div><div class="meta">${esc(n.note||"")}</div></div>`}
function table(t){return `<div class="table-wrap"><div class="caption">定格総荷重表（代表値・全表は原本参照）</div><table class="capacity"><thead><tr>${t.headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function node(n,root=false){if(n.table)return `<section class="node"><div class="children">${table(n.table)}</div></section>`;return `<details class="node" ${root?"open":""}><summary>${esc(n.name)}</summary><div class="children">${(n.children||[]).map(x=>x.children?node(x):leaf(x)).join("")}</div></details>`}
function render(){const m=CRANE_DATA.models[state.model];document.getElementById("tabs").innerHTML=CRANE_DATA.models.map((x,i)=>`<button class="tab" role="tab" aria-selected="${i===state.model}" data-i="${i}">${esc(x.name)}</button>`).join("");document.getElementById("app").innerHTML=`<section class="summary"><h2>${esc(m.name)}</h2><div class="source">出典：${esc(m.source)}</div><div class="notice">定格総荷重の抜粋値は検索・閲覧用です。空欄はその組合せが表に掲載されていないことを示します。換算・推測・補完はしていません。</div></section><div class="tree">${m.children.map(x=>x.children?node(x,true):node(x)).join("")}</div>`;document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{state.model=Number(b.dataset.i);render()}))}
document.getElementById("openAll").addEventListener("click",()=>document.querySelectorAll("details.node").forEach(x=>x.open=true));document.getElementById("closeAll").addEventListener("click",()=>document.querySelectorAll("details.node").forEach(x=>x.open=false));render();
