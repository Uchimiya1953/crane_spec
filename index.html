const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const statusLabel={ok:"記載値",missing:"未記載",unreadable:"読み取り不能",check:"要確認"};
function leaf(n){const st=n.status||"ok";return `<div class="leaf ${st}"><div class="name">${esc(n.name)}<span class="badge">${statusLabel[st]}</span></div><div class="val">${esc(n.value)}</div><div class="unit">${esc(n.unit)}</div><div class="meta">${esc(n.note||"")}</div></div>`}
function th(h){return esc(h).replace(/ /g,"<br>")}
function table(t){const hd=`<tr>${t.headers.map(h=>`<th scope="col">${th(h)}</th>`).join("")}</tr>`;
 const rows=t.rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th scope="row">${esc(c)}</th>`:`<td${c===""?' class="blank"':""}>${esc(c)}</td>`).join("")}</tr>`).join("");
 const ft=(t.foot||[]).map(f=>`<tr><th scope="row">${esc(f.label)}</th>${f.cells.map(c=>`<td colspan="${c[1]}">${esc(c[0])}</td>`).join("")}</tr>`).join("");
 return `<div class="table-wrap"><div class="capacity-scroll"><table class="capacity"><thead>${hd}</thead><tbody>${rows}</tbody>${ft?`<tfoot>${ft}</tfoot>`:""}</table></div></div>`}
function node(n,cls=""){
 if(n.table)return `<details class="node ${cls}"><summary>${esc(n.name)}</summary><div class="children">${n.note?`<div class="tnote">出典：${esc(n.note)}</div>`:""}${table(n.table)}</div></details>`;
 const kids=(n.children||[]).map(x=>(x.children||x.table)?node(x,cls==="capnode"||x.name==="定格総荷重表"?"capnode":""):leaf(x)).join("");
 return `<details class="node ${cls}"><summary>${esc(n.name)}</summary><div class="children">${n.note&&n.children?`<div class="tnote">${esc(n.note)}</div>`:""}${kids}</div></details>`}
function modelNode(m){return `<details class="node model-node"><summary>${esc(m.name)}</summary><div class="children"><div class="source">出典：${esc(m.source)}</div>${m.children.map(x=>node(x,x.name==="定格総荷重表"?"capnode":"")).join("")}</div></details>`}
function render(){document.getElementById("app").innerHTML=`<details class="node tree-root" open><summary>📁 ラフタークレーン</summary><div class="children">${CRANE_DATA.models.map(modelNode).join("")}</div></details>`}
document.getElementById("openAll").addEventListener("click",()=>document.querySelectorAll("details.node").forEach(x=>x.open=true));
document.getElementById("closeAll").addEventListener("click",()=>document.querySelectorAll("details.node").forEach(x=>x.open=x.classList.contains("tree-root")));
render();
</script>
